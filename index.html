<!DOCTYPE html>
<html>
<head>
<title>For Harshitha 💗</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    text-align: center;
}

#tap {
    font-size: 32px;
    color: #ff5c9a;
    cursor: pointer;
}

#message {
    display: none;
    font-size: 48px;
    font-weight: bold;
    line-height: 1.4;
    color: #ff4f91;
    animation: pop 1s ease;
    z-index: 10;
}

.heart {
    position: fixed;
    top: -50px;
    font-size: 35px;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 5;
}

@keyframes fall {
    from {
        transform: translateY(-50px) rotate(0deg);
        opacity: 1;
    }

    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes pop {
    from {
        transform: scale(0);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}
</style>
</head>

<body>

<div id="tap">Tap here 💗</div>

<div id="message">
    I LOVE YOU<br>
    Sri Harshitha 💗🫶✨
</div>

<script>

document.getElementById("tap").onclick = function() {
    this.style.display = "none";
    document.getElementById("message").style.display = "block";
};

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = "💗";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize =
        (28 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (3 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 7000);
}

setInterval(createHeart, 250);

</script>

</body>
</html>
